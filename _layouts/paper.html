---
layout: default
---

<h2 class="paper-title">{{ page.title }}</h2>

<p class="paper-authors">{{ page.authors }}</p>

{% if page.status %}
<p class="paper-meta"><i>{{ page.status }}</i></p>
{% endif %}

<p class="abstract">{{ page.abstract }}</p>

<p><a class="button" href="{{ page.pdf }}">Read the paper (PDF)</a></p>
